<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cebula — AI Cost Calculator</title>
  <meta name="description" content="Peel back what AI is really costing your team and projects." />
  <meta property="og:title" content="Cebula — AI Cost Calculator" />
  <meta property="og:description" content="Peel back what AI is really costing your team and projects." />
  <meta name="theme-color" content="#f5fbff" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="shortcut icon" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="../css/styles.css?v=20260630-2" />
</head>
<body>
  <!-- Hidden form for Netlify build-time detection -->
  <form name="cebula-leads" netlify hidden>
    <input name="email" />
    <input name="team_name" />
    <input name="project_name" />
    <input name="estimate_low" />
    <input name="estimate_high" />
    <input name="adoption_level" />
  </form>

  <header class="header">
    <div class="header-left">
      <a class="back-link" href="../">← Back to cebula.tools</a>
      <a class="logo" href="../">
        <img class="logo-img" src="../assets/logo-calculator.png" alt="Cebula AI Cost Calculator" width="488" height="64" />
      </a>
    </div>
    <span class="tagline">Peel back what AI is really costing you.</span>
  </header>
  <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
  <p id="step-indicator" class="step-indicator"></p>
  <main class="wrap"><section id="wizard-content"></section></main>

  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script type="module">
    import { renderStep, updateProgress } from "../js/wizard.js";
    import { getState } from "../js/state.js";
    const n = getState().currentStep || 1;
    updateProgress(n);
    renderStep(n);
  </script>
</body>
</html>
